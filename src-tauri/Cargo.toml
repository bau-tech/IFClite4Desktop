[package]
name = "ifclite-desktop"
version = "0.1.0"
description = "Windows desktop IFC viewer built on IFC-Lite and Three.js"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "ifclite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
